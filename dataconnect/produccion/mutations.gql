# RF17: se conserva CrearComanda para clientes anteriores; la web usa esta
# operación atómica. @allow impide inyectar IDs, comanda, estado o timestamps.
mutation CrearComandaConFlujo(
  $id: UUID!
  $numeroComanda: String!
  $clienteId: UUID!
  $empresa: String
  $proyecto: String
  $observaciones: String
  # KILO: cada línea lleva su parte del peso, precioUnitario = $precioKg y
  # subtotal = peso × precio (redondeado al peso más cercano).
  $modalidadCobro: UnidadCobro! = PRENDA
  $precioKg: Float
  $detalles: [ComandaDetalle_Data!]! @allow(fields: "tipoPrendaId tipoServicioId cantidad detalle pesoKg precioUnitario subtotal", maxCount: 100)
) @auth(level: USER) @transaction {
  query @redact @check(expr: "vars.numeroComanda.matches('^[A-Za-z0-9-]{1,20}$') && (!vars.numeroComanda.upperAscii().startsWith('ELCOBRE-') || (vars.numeroComanda.upperAscii().matches('^ELCOBRE-[A-Z0-9]{4}$') && vars.numeroComanda.upperAscii().matches('^ELCOBRE-[A-Z0-9]*[A-Z][A-Z0-9]*$') && vars.numeroComanda.upperAscii().matches('^ELCOBRE-[A-Z0-9]*[0-9][A-Z0-9]*$'))) && vars.detalles.size() > 0 && vars.detalles.all(d, has(d.tipoPrendaId) && d.tipoPrendaId != null && has(d.tipoServicioId) && d.tipoServicioId != null && has(d.cantidad) && d.cantidad != null && d.cantidad > 0 && has(d.precioUnitario) && d.precioUnitario != null && d.precioUnitario >= 0 && has(d.subtotal) && d.subtotal != null && d.subtotal >= 0 && (!has(d.pesoKg) || d.pesoKg == null || (d.pesoKg > 0.0 && d.pesoKg <= 10000.0)) && (vars.modalidadCobro == 'KILO' ? (has(d.pesoKg) && d.pesoKg != null && d.precioUnitario == vars.precioKg && d.subtotal >= d.pesoKg * d.precioUnitario - 1.0 && d.subtotal <= d.pesoKg * d.precioUnitario + 1.0) : d.subtotal == double(d.cantidad) * d.precioUnitario)) && (vars.modalidadCobro != 'KILO' || (has(vars.precioKg) && vars.precioKg != null && vars.precioKg > 0.0 && vars.precioKg <= 1000000.0))", message: "Las prendas, cantidades, montos, el precio por kg o los pesos son inválidos") {
    usuario(id_expr: "auth.uid") @check(expr: "this != null", message: "Perfil no encontrado") {
      activo @check(expr: "this == true", message: "La cuenta está inactiva")
      rol { nombre @check(expr: "this in ['admin', 'recepcionista']", message: "No autorizado para gestionar comandas") }
    }
    etapas: etapaProduccions(orderBy: [{ orden: ASC }], limit: 6)
      @check(expr: "this.size() == 5 && this[0].orden == 1 && this[1].orden == 2 && this[2].orden == 3 && this[3].orden == 4 && this[4].orden == 5", message: "Configura las cinco etapas de producción antes de guardar") {
      id nombre orden descripcion tiempoEstimadoMin
    }
    cliente(id: $clienteId) @check(expr: "this != null", message: "Cliente no encontrado") { id }
    numeroDisponible: comanda(first: { where: { numeroComanda: { pattern: { like: $numeroComanda, ignoreCase: true } } } })
      @check(expr: "this == null", message: "El número de comanda ya existe") { id }
  }
  comanda_insert(data: {
    id: $id
    numeroComanda_expr: "vars.numeroComanda.upperAscii().startsWith('ELCOBRE-') ? vars.numeroComanda.upperAscii() : vars.numeroComanda"
    clienteId: $clienteId
    empresa: $empresa
    proyecto: $proyecto
    observaciones: $observaciones
    modalidadCobro: $modalidadCobro
    precioKg: $precioKg
    recepcionistaId_expr: "auth.uid"
    estado: PENDIENTE
    comandaDetalles_on_comanda: $detalles
  })
  comandaEtapa_insertMany(data: [
    {
      comandaId_expr: "response.comanda_insert.id"
      etapaId_expr: "response.query.etapas[0].id"
      nombreEtapa_expr: "response.query.etapas[0].nombre"
      ordenEtapa_expr: "response.query.etapas[0].orden"
      descripcionEtapa_expr: "response.query.etapas[0].descripcion"
      tiempoEstimadoMin_expr: "response.query.etapas[0].tiempoEstimadoMin != null ? response.query.etapas[0].tiempoEstimadoMin : 15"
      estado: PENDIENTE
    }
    {
      comandaId_expr: "response.comanda_insert.id"
      etapaId_expr: "response.query.etapas[1].id"
      nombreEtapa_expr: "response.query.etapas[1].nombre"
      ordenEtapa_expr: "response.query.etapas[1].orden"
      descripcionEtapa_expr: "response.query.etapas[1].descripcion"
      tiempoEstimadoMin_expr: "response.query.etapas[1].tiempoEstimadoMin != null ? response.query.etapas[1].tiempoEstimadoMin : 90"
      estado: PENDIENTE
    }
    {
      comandaId_expr: "response.comanda_insert.id"
      etapaId_expr: "response.query.etapas[2].id"
      nombreEtapa_expr: "response.query.etapas[2].nombre"
      ordenEtapa_expr: "response.query.etapas[2].orden"
      descripcionEtapa_expr: "response.query.etapas[2].descripcion"
      tiempoEstimadoMin_expr: "response.query.etapas[2].tiempoEstimadoMin != null ? response.query.etapas[2].tiempoEstimadoMin : 60"
      estado: PENDIENTE
    }
    {
      comandaId_expr: "response.comanda_insert.id"
      etapaId_expr: "response.query.etapas[3].id"
      nombreEtapa_expr: "response.query.etapas[3].nombre"
      ordenEtapa_expr: "response.query.etapas[3].orden"
      descripcionEtapa_expr: "response.query.etapas[3].descripcion"
      tiempoEstimadoMin_expr: "response.query.etapas[3].tiempoEstimadoMin != null ? response.query.etapas[3].tiempoEstimadoMin : 60"
      estado: PENDIENTE
    }
    {
      comandaId_expr: "response.comanda_insert.id"
      etapaId_expr: "response.query.etapas[4].id"
      nombreEtapa_expr: "response.query.etapas[4].nombre"
      ordenEtapa_expr: "response.query.etapas[4].orden"
      descripcionEtapa_expr: "response.query.etapas[4].descripcion"
      tiempoEstimadoMin_expr: "response.query.etapas[4].tiempoEstimadoMin != null ? response.query.etapas[4].tiempoEstimadoMin : 1440"
      estado: PENDIENTE
    }
  ])
  totales: query @redact {
    detalles: comandaDetalles(where: { comandaId: { eq: $id } }) { subtotal_sum }
  }
  comanda_update(id: $id, data: { valorTotal_expr: "response.totales.detalles[0].subtotal_sum" })
  comandaHistorialEstado_insert(data: {
    comandaId: $id
    usuarioId_expr: "auth.uid"
    estadoNuevo: PENDIENTE
    motivo: "Creación de comanda y asociación de flujo de producción"
  })
}

# Reemplazo atómico: un fallo conserva cabecera, total y prendas originales.
# La versión impide guardar encima de cambios que el formulario aún no ha leído.
# $modalidadCobro es obligatoria y sin valor por defecto: un cliente que no la
# envía (la app móvil anterior al cobro por kg) es rechazado antes de tocar la
# comanda, en vez de convertir en silencio una comanda KILO en PRENDA y borrar
# los pesos de sus prendas.
mutation EditarComandaConDetalles(
  $id: UUID!
  $version: Timestamp!
  $empresa: String
  $proyecto: String
  $observaciones: String
  $modalidadCobro: UnidadCobro!
  $precioKg: Float
  $detalles: [ComandaDetalle_Data!]! @allow(fields: "comandaId tipoPrendaId tipoServicioId cantidad detalle pesoKg precioUnitario subtotal", maxCount: 100)
) @auth(level: USER) @transaction {
  query @redact @check(expr: "vars.detalles.size() > 0 && vars.detalles.all(d, has(d.comandaId) && d.comandaId == vars.id && has(d.tipoPrendaId) && d.tipoPrendaId != null && has(d.tipoServicioId) && d.tipoServicioId != null && has(d.cantidad) && d.cantidad != null && d.cantidad > 0 && has(d.precioUnitario) && d.precioUnitario != null && d.precioUnitario >= 0 && has(d.subtotal) && d.subtotal != null && d.subtotal >= 0 && (!has(d.pesoKg) || d.pesoKg == null || (d.pesoKg > 0.0 && d.pesoKg <= 10000.0)) && (vars.modalidadCobro == 'KILO' ? (has(d.pesoKg) && d.pesoKg != null && d.precioUnitario == vars.precioKg && d.subtotal >= d.pesoKg * d.precioUnitario - 1.0 && d.subtotal <= d.pesoKg * d.precioUnitario + 1.0) : d.subtotal == double(d.cantidad) * d.precioUnitario)) && (vars.modalidadCobro != 'KILO' || (has(vars.precioKg) && vars.precioKg != null && vars.precioKg > 0.0 && vars.precioKg <= 1000000.0))", message: "Las prendas, cantidades, montos, el precio por kg o los pesos son inválidos") {
    usuario(id_expr: "auth.uid") @check(expr: "this != null", message: "Perfil no encontrado") {
      activo @check(expr: "this == true", message: "La cuenta está inactiva")
      rol { nombre @check(expr: "this in ['admin', 'recepcionista']", message: "No autorizado para editar comandas") }
    }
    comanda(id: $id) @check(expr: "this != null", message: "Comanda no encontrada") {
      estado @check(expr: "this == 'PENDIENTE'", message: "Solo puedes editar comandas pendientes")
      actualizadoEn @check(expr: "this == vars.version", message: "La comanda cambió. Actualiza antes de editar")
    }
    tiposPrenda: tipoPrendas
      @check(expr: "vars.detalles.all(d, this.exists(p, p.id == d.tipoPrendaId))", message: "Una prenda ya no existe") { id }
    tiposServicio: tipoServicios
      @check(expr: "vars.detalles.all(d, this.exists(s, s.id == d.tipoServicioId))", message: "Un servicio ya no existe") { id }
  }
  bloqueo: comanda_update(
    first: { where: { id: { eq: $id }, estado: { eq: PENDIENTE }, actualizadoEn: { eq: $version } } }
    data: { actualizadoEn_expr: "request.time", empresa: $empresa, proyecto: $proyecto, observaciones: $observaciones, modalidadCobro: $modalidadCobro, precioKg: $precioKg }
  ) @check(expr: "this != null", message: "La comanda cambió o ya no está pendiente. Actualiza antes de editar")
  comandaDetalle_deleteMany(where: { comandaId: { eq: $id } })
  comandaDetalle_insertMany(data: $detalles)
  totales: query @redact {
    detalles: comandaDetalles(where: { comandaId: { eq: $id } }) { subtotal_sum }
  }
  comanda_update(id: $id, data: { valorTotal_expr: "response.totales.detalles[0].subtotal_sum" })
}
